[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-flow"
version = "0.1.0a1"
description = "Asynchronous workflow and consent processes for Sovereign Core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
keywords = ["local-first", "workflow", "consent", "decision-making", "sovereign-protocol"]
dependencies = [
  "sovereign-protocol>=0.1.7,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
desktop = ["pywebview>=5,<6"]

[project.scripts]
s-flow-desktop = "s_flow.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["s_flow*"]

[tool.setuptools.package-data]
"s_flow.assets" = ["*.css", "*.html", "*.js"]
"s_flow.workflow" = ["templates/*.bpmn", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
